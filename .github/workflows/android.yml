name: Android widget

# Builds the Android home-screen widget app and publishes it as the "android" release (Releases → Barnes trains),
# so it can be downloaded on the phone and installed.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk barnes-trains.apk
      - uses: actions/upload-artifact@v4
        with:
          name: barnes-trains-apk
          path: barnes-trains.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android barnes-trains.apk --title "Barnes trains (Android widget)" \
            --notes "Download barnes-trains.apk on your Android phone and open it to install. Build ${{ github.run_number }}."
